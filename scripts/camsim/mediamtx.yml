    runOnInitRestart: yes
  cam3:
    runOnInit: sh /publish.sh 'cam3 main' 1280x720 15 h264 1500 $RTSP_PORT $MTX_PATH
    runOnInitRestart: yes
  cam3sub:
    runOnInit: sh /publish.sh 'cam3 sub' 640x360 10 h264 400 $RTSP_PORT $MTX_PATH
    runOnInitRestart: yes
  cam4:
    runOnInit: sh /publish.sh 'cam4 main' 1280x720 15 h265 1500 $RTSP_PORT $MTX_PATH

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]
hls: no
webrtc: no
api: no
metrics: no
pprof: no
playback: no
srt: no
rtmp: no
logLevel: info
paths:
  cam1:
    runOnInit: sh /publish.sh 'cam1 main' 1280x720 15 h264 1500 $RTSP_PORT $MTX_PATH
    runOnInitRestart: yes
  cam1sub:
    runOnInit: sh /publish.sh 'cam1 sub' 640x360 10 h264 400 $RTSP_PORT $MTX_PATH
    runOnInitRestart: yes
  cam2:
    runOnInit: sh /publish.sh 'cam2 main' 1280x720 15 h264 1500 $RTSP_PORT $MTX_PATH
    runOnInitRestart: yes
  cam2sub:
